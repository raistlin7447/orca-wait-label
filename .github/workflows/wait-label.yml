name: Wait for response label

on:
  schedule:
    # GitHub does not allow a variable here. Every 10 minutes, offset from the top of the hour, when GitHub delays scheduled runs the most
    - cron: '7-57/10 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Change labels (otherwise only log what would change)
        type: boolean
        default: false
      since:
        description: 'Judge activity after this ISO time (default: where the last run that changed labels stopped)'
        required: false

permissions:
  contents: read

concurrency:
  group: wait-label

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Scheduled runs take a minute or two; a manual catch-up over days of activity takes longer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          provider: claude
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.WAIT_LABEL_GITHUB_TOKEN }}
          repository: OrcaSlicer/OrcaSlicer
          label: wait for response
          command-prefix: /bot
          # The labels are already up to date, so there is nothing to work through on the first run
          lookback-hours: 2
          # Scheduled runs change labels only once the repository variable WAIT_LABEL_APPLY is true
          dry-run: ${{ !((github.event_name == 'schedule' && vars.WAIT_LABEL_APPLY == 'true') || inputs.apply) }}
          since: ${{ inputs.since }}
